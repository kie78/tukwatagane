name: tukwatagane
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.0
  url_launcher: ^6.2.5
  geolocator: ^13.0.2
  share_plus: ^10.1.3
  image_picker: ^1.1.2
  dio: ^5.4.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.0.0
  stomp_dart_client: ^3.0.1
  json_annotation: ^4.8.1
  google_maps_flutter: ^2.9.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
  web:
    generate: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
